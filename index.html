<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind-OS</title>
    <style>
        :root {
            --primary-bg: rgba(255, 255, 255, 0.15);
            --blur-effect: blur(20px);
            --border-style: 1px solid rgba(255, 255, 255, 0.25);
            --shadow-style: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        /* Desktop Background */
        .desktop {
            width: 100vw;
            height: 100vh;
            background: url('https://unsplash.com') no-repeat center center/cover;
            position: relative;
            padding: 20px;
        }

        /* Desktop Shortcuts */
        .shortcut {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            font-size: 13px;
        }

        .shortcut img {
            width: 45px;
            height: 45px;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }

        .shortcut:hover img {
            transform: scale(1.05);
        }

        /* Taskbar Styling */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: var(--blur-effect);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .taskbar-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .tb-icon {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tb-icon:hover {
            transform: scale(1.15);
        }

        /* OS Windows */
        .window {
            position: absolute;
            top: 15%;
            left: 25%;
            width: 500px;
            height: 350px;
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: var(--blur-effect);
            border: var(--border-style);
            box-shadow: var(--shadow-style);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .window-header {
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            font-size: 14px;
            font-weight: 500;
        }

        .window-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            border-radius: 4px;
        }

        .window-controls button.close:hover {
            background: #e81123;
        }

        .window-content {
            flex: 1;
            padding: 15px;
            color: white;
            background: rgba(20, 20, 20, 0.4);
            overflow-y: auto;
        }

        /* Start Menu Panel */
        .start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            width: 520px;
            height: 600px;
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: var(--blur-effect);
            border: var(--border-style);
            box-shadow: var(--shadow-style);
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
            z-index: 9998;
            padding: 30px;
            color: white;
        }

        .start-menu.active {
            transform: translateX(-50%) translateY(0);
        }

        .start-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .start-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
        }

        .start-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .start-item img {
            width: 36px;
            height: 36px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="desktop" id="desktop">
        <!-- Desktop Icon -->
        <div class="shortcut" onclick="toggleWindow('browser-win')">
            <img src="https://flaticon.com" alt="Browser">
            <span>Browser</span>
        </div>

        <!-- Start Menu -->
        <div class="start-menu" id="startMenu">
            <h3>Pinned Apps</h3>
            <div class="start-grid">
                <div class="start-item" onclick="toggleWindow('browser-win'); toggleStart()">
                    <img src="https://flaticon.com" alt="Browser">
                    <span>Edge</span>
                </div>
                <div class="start-item" onclick="toggleWindow('notes-win'); toggleStart()">
                    <img src="https://flaticon.com" alt="Notepad">
                    <span>Notepad</span>
                </div>
            </div>
        </div>

        <!-- Sample Window 1: Browser -->
        <div class="window" id="browser-win">
            <div class="window-header" onmousedown="dragElement(this.parentElement)">
                <span>Web Browser</span>
                <div class="window-controls">
                    <button class="close" onclick="toggleWindow('browser-win')">✕</button>
                </div>
            </div>
            <div class="window-content" style="padding:0;">
                <iframe src="https://bing.com" style="width:100%; height:100%; border:none; background: white;"></iframe>
            </div>
        </div>

        <!-- Sample Window 2: Notepad -->
        <div class="window" id="notes-win">
            <div class="window-header" onmousedown="dragElement(this.parentElement)">
                <span>Notepad</span>
                <div class="window-controls">
                    <button class="close" onclick="toggleWindow('notes-win')">✕</button>
                </div>
            </div>
            <div class="window-content">
                <textarea style="width:100%; height:100%; background:transparent; color:white; border:none; resize:none; outline:none;" placeholder="Type something..."></textarea>
            </div>
        </div>

        <!-- Taskbar -->
        <div class="taskbar">
            <div class="taskbar-icons">
                <!-- Windows Start Button -->
                <img src="https://flaticon.com" class="tb-icon" onclick="toggleStart()" alt="Start">
                <img src="https://flaticon.com" class="tb-icon" onclick="toggleWindow('browser-win')" alt="Browser">
                <img src="https://flaticon.com" class="tb-icon" onclick="toggleWindow('notes-win')" alt="Notepad">
            </div>
        </div>
    </div>

    <script>
        // Toggle Start Menu
        function toggleStart() {
            const startMenu = document.getElementById('startMenu');
            startMenu.classList.toggle('active');
        }

        // Open/Close Windows
        function toggleWindow(id) {
            const win = document.getElementById(id);
            if(win.style.display === 'flex') {
                win.style.display = 'none';
            } else {
                win.style.display = 'flex';
                // Bring to front
                document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
                win.style.zIndex = 100;
            }
        }

        // Draggable Windows Logic
        function dragElement(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = elmnt.querySelector('.window-header');
            
            header.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                // Focus window on click
                document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
                elmnt.style.zIndex = 100;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }
    </script>
</body>
</html>
